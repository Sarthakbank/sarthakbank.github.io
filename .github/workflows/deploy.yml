# Deploy static Next.js site to GitHub Pages (USER site: https://sarthakbank.github.io/)
# Requires: Settings → Pages → Build and deployment → Source: GitHub Actions
# No basePath / assetPrefix — `out/` is site root.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          # Match local `.env.local` when set: repo → Settings → Secrets and variables → Actions → Variables → `NEXT_PUBLIC_IMMERSIVE_LAB` = `true`
          NEXT_PUBLIC_IMMERSIVE_LAB: ${{ vars.NEXT_PUBLIC_IMMERSIVE_LAB }}
        run: |
          echo "NEXT_PUBLIC_IMMERSIVE_LAB (build) = '${NEXT_PUBLIC_IMMERSIVE_LAB:-}'  ← must be exactly 'true' to match .env.local"
          npm run build

      - name: Verify static export output
        run: |
          test -d out || { echo "Missing out/ — is output: \"export\" set in next.config?"; exit 1; }
          test -f out/index.html || { echo "Missing out/index.html"; exit 1; }
          # Jekyll would otherwise ignore _next; Next usually emits this — ensure it exists.
          if [ ! -f out/.nojekyll ]; then touch out/.nojekyll; fi
          echo "Export OK ($(du -sh out | cut -f1))"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
